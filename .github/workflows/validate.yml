name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - agent/issue-8-plugin-packaging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml pillow

      - name: Compile validation scripts
        run: |
          set -euo pipefail
          python -m compileall -q scripts tests

      - name: Run complete offline validation
        run: |
          set -euo pipefail
          python scripts/validate_all.py | tee validation.log

      - name: Build deterministic packages twice
        run: |
          set -euo pipefail
          python scripts/build_plugin_package.py --out-dir /tmp/sgp-first --json | tee first-build.json
          python scripts/build_plugin_package.py --out-dir /tmp/sgp-second --json | tee second-build.json
          python - <<'PY'
          import json
          from pathlib import Path

          first = json.loads(Path("first-build.json").read_text())
          second = json.loads(Path("second-build.json").read_text())
          assert first["archive_sha256"] == second["archive_sha256"], (first, second)
          assert first["file_count"] == second["file_count"], (first, second)
          print("deterministic package: PASS")
          print(f"archive_sha256: {first['archive_sha256']}")
          print(f"file_count: {first['file_count']}")
          PY

      - name: Verify archive manifest and checksum
        run: |
          set -euo pipefail
          python scripts/validate_plugin_package.py \
            --archive /tmp/sgp-first/silver-gold-image-pipeline-0.1.0.zip \
            --manifest /tmp/sgp-first/silver-gold-image-pipeline-0.1.0.zip.manifest.json \
            --checksum /tmp/sgp-first/silver-gold-image-pipeline-0.1.0.zip.sha256 \
            --json | tee package-validation.json
          python scripts/test_installation.py --json | tee installation-smoke.json

      - name: Prepare evidence artifact
        if: always()
        run: |
          mkdir -p evidence
          cp validation.log first-build.json second-build.json package-validation.json installation-smoke.json evidence/ 2>/dev/null || true
          cp /tmp/sgp-first/silver-gold-image-pipeline-0.1.0.zip* evidence/ 2>/dev/null || true
          git rev-parse HEAD > evidence/exact-head.txt

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sgp-validation-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
